<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pets Book | The Kingdom Sanctuary</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">

    <div class="max-w-2xl mx-auto pt-16 pb-8 text-center px-4">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mb-6 border-4 border-white shadow-sm">
            <span class="text-4xl">👑</span>
        </div>
        <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 mb-2">My Pets Book</h1>
        <p class="text-lg text-slate-600 font-medium">Welcome to the Kingdom</p>
    </div>

    <main class="max-w-md mx-auto px-4 pb-20">
        <div class="bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/60 p-8 border border-slate-100">
            
            <p class="text-center text-slate-500 mb-8 leading-relaxed">
                A private, gamified sanctuary for your pet's journey. Track moments, earn badges, and join the community.
            </p>

            <a href="https://mypetsbook.app/" class="block w-full bg-green-600 hover:bg-green-700 text-white text-center py-4 rounded-2xl font-bold text-lg transition-all active:scale-[0.98] shadow-lg shadow-green-200 mb-4">
                Enter the Kingdom 🐾
            </a>

            <div class="h-px bg-slate-100 my-8"></div>

            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 text-center">Trust & Transparency</h2>
            
            <div class="space-y-3">
                <a href="https://kdahal.github.io/mypetsbook-terms-policy/" class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100 hover:bg-slate-100 transition-colors">
                    <div class="flex items-center">
                        <span class="text-xl mr-3">🛡️</span>
                        <span class="font-semibold text-slate-700">Privacy Policy</span>
                    </div>
                    <span class="text-slate-300">→</span>
                </a>

                <a href="https://kdahal.github.io/mypetsbook-terms-policy/termsconditions.html" class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100 hover:bg-slate-100 transition-colors">
                    <div class="flex items-center">
                        <span class="text-xl mr-3">📜</span>
                        <span class="font-semibold text-slate-700">Terms of Service</span>
                    </div>
                    <span class="text-slate-300">→</span>
                </a>
            </div>
        </div>

        <footer class="mt-12 text-center">
            <p class="text-sm text-slate-400 italic">Built for pet lovers, by a pet lover.</p>
        </footer>
    </main>

</body>
</html>
